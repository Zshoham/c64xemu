/* SYS/BIOS and NDK configuration for the emulated C6455.
 *
 * Everything here is TI's: SYS/BIOS supplies the tasks, semaphores, clock and Hwi that the NDK's
 * own OS adaptation layer (ti.ndk.os) is written against, and ti.ndk.config.Global generates the
 * stack thread that calls NC_SystemOpen/NC_NetStart. The only code this project adds is the NIMU
 * mini-driver for the emulated EMAC and the application task, because a driver is board support
 * and TI ships those per board in an NSP.
 *
 * There is no prebuilt SYS/BIOS library for ti.targets.elf.C64P in 6.45, so the library is built
 * from TI's sources for this exact configuration (BIOS.libType = Custom).
 */

var BIOS = xdc.useModule('ti.sysbios.BIOS');
BIOS.libType = BIOS.LibType_Custom;
BIOS.heapSize = 0x20000;
BIOS.cpuFreq.lo = 1000000000;   /* the C6455 in this emulator runs at 1 GHz */

var Task = xdc.useModule('ti.sysbios.knl.Task');
Task.defaultStackSize = 0x4000;
Task.idleTaskStackSize = 0x1000;
Task.checkStackFlag = true;

var Clock = xdc.useModule('ti.sysbios.knl.Clock');
Clock.tickPeriod = 1000;        /* 1 ms, so the NDK's 100 ms tick is exact */

var Semaphore = xdc.useModule('ti.sysbios.knl.Semaphore');
var Hwi = xdc.useModule('ti.sysbios.family.c64p.Hwi');
/* The EMAC's interrupt: system event 17 (MACINT, SPRS276M Table 7-10) routed through INTMUX to
 * CPU interrupt 5, so a frame wakes the stack thread instead of waiting for the next tick. */
Hwi.create(5, '&emac_isr', {eventId: 17, enableInt: true});
var Cache = xdc.useModule('ti.sysbios.family.c64p.Cache');
/* Use the C6455's largest caches. The image occupies only the low 240 KiB of L2 SRAM, so
 * reserving the upper 256 KiB for L2 cache does not overlap a linked section. MAR224-239 cover
 * this platform's 256 MiB DDR2 window; the NIMU driver maintains its DMA buffers explicitly. */
Cache.initSize.l1pSize = Cache.L1Size_32K;
Cache.initSize.l1dSize = Cache.L1Size_32K;
Cache.initSize.l2Size = Cache.L2Size_256K;
Cache.MAR224_255 = 0x0000ffff;
var HeapMem = xdc.useModule('ti.sysbios.heaps.HeapMem');
var System = xdc.useModule('xdc.runtime.System');
var SysStd = xdc.useModule('xdc.runtime.SysStd');
System.SupportProxy = SysStd;

/* The NDK itself. */
var Global = xdc.useModule('ti.ndk.config.Global');
Global.IPv6 = false;
Global.enableCodeGeneration = true;
Global.stackLibType = Global.MIN;
Global.networkOpenHook = '&app_network_open';
Global.networkCloseHook = '&app_network_close';
Global.networkIPAddrHook = '&app_ip_address';
Global.ndkThreadStackSize = 0x6000;
Global.pktNumFrameBufs = 96;
/* A 10 ms NDK tick: the stack services the driver on its tick, and emulated time is the
 * scarce resource here, so a shorter tick is what makes an exchange finish in a few
 * emulated milliseconds rather than seconds. */
Global.ndkTickPeriod = 10;
Global.pktSizeFrameBuf = 1664;
/* The pool has to be larger than the window the far end can have in flight in both directions
 * at once, or the stack drops segments it has no buffer for and the exchange stalls: 20 buffers
 * is not enough for a 4 KB window echoed back, 96 is. */
Global.memRawPageCount = 8;

/* A static address on the host-side subnet: the TAP interface is 192.168.64.1. */
var Ip = xdc.useModule('ti.ndk.config.Ip');
/* No static address: an empty Ip.address is what makes the generated configuration start the
 * NDK's DHCP client on this interface (ti/ndk/config/Ip.xdt), and setting autoIp is the
 * documented way to ask for that. The host peer serves the lease. */
Ip.autoIp = true;
Ip.mask = '255.255.255.0';
Ip.gatewayIpAddr = '192.168.64.1';
Ip.ifIdx = 1;

/* The NDK's own HTTP server, serving a page the application puts in the embedded file system.
 * It is a large body of TI code the emulator would otherwise never run. */
var Http = xdc.useModule('ti.ndk.config.Http');
Http.create();

/* TI's own telnet daemon, with TI's own console behind it: the callback the daemon calls for each
 * connection is the NDK console's ConsoleOpen, which spawns the console task on a pipe. */
var Telnet = xdc.useModule('ti.ndk.config.Telnet');
var telnet = Telnet.create();
telnet.port = 23;
telnet.maxCon = 2;
telnet.callBackFxn = "&ConsoleOpen";

var Tcp = xdc.useModule('ti.ndk.config.Tcp');
Tcp.transmitBufSize = 8192;
Tcp.receiveBufSize = 8192;
