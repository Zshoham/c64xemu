/* SYS/BIOS on the emulated C6455, exercising the kernel rather than a peripheral: three tasks
 * handing work along a chain of semaphores, a Swi posted from a hardware interrupt, and a second
 * hardware interrupt that arrives while the first one is still running so the dispatcher has to
 * nest. Everything TI's - the scheduler, the Hwi dispatcher and its assembly context save - runs
 * as built by TI's own tools. */
var BIOS = xdc.useModule('ti.sysbios.BIOS');
BIOS.libType = BIOS.LibType_Custom;
BIOS.heapSize = 0x20000;
BIOS.cpuFreq.lo = 300000000;
BIOS.cpuFreq.hi = 0;

var Task = xdc.useModule('ti.sysbios.knl.Task');
Task.defaultStackSize = 0x2000;
Task.idleTaskStackSize = 0x1000;
Task.numPriorities = 8;

var Semaphore = xdc.useModule('ti.sysbios.knl.Semaphore');
var Swi = xdc.useModule('ti.sysbios.knl.Swi');
var Clock = xdc.useModule('ti.sysbios.knl.Clock');
Clock.tickPeriod = 1000;
var Mailbox = xdc.useModule('ti.sysbios.knl.Mailbox');
var Event = xdc.useModule('ti.sysbios.knl.Event');

/* Both interrupts are dispatched, so nesting, Swi posting and task readying all go through TI's
 * dispatcher. Timer 1's lower-half event is EDMA3 event 3 in the megamodule map; the CPU
 * interrupt numbers here are the ones INTMUX is programmed for. */
var Hwi = xdc.useModule('ti.sysbios.family.c64p.Hwi');
Hwi.dispatcherAutoNestingSupport = true;
Hwi.dispatcherSwiSupport = true;
Hwi.dispatcherTaskSupport = true;

var Cache = xdc.useModule('ti.sysbios.family.c64p.Cache');
var HeapMem = xdc.useModule('ti.sysbios.heaps.HeapMem');
var System = xdc.useModule('xdc.runtime.System');
var SysStd = xdc.useModule('xdc.runtime.SysStd');
System.SupportProxy = SysStd;

Program.stack = 0x2000;
